name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: make testlua

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make testserver
      # server/dist/ is committed, not built at install time - fails if a
      # change to server/src wasn't followed by `make build` before commit.
      - run: make checkbuild
