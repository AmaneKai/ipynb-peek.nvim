name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: make testlua

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make testserver
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ipykernel jupyter-core
      - run: python -m ipykernel install --user --name ipynb-peek-e2e
      - run: cd server && IPYNB_PEEK_E2E_KERNEL=ipynb-peek-e2e npm run test:e2e
      # server/dist/ is committed, not built at install time - fails if a
      # change to server/src wasn't followed by `make build` before commit.
      - run: make checkbuild
