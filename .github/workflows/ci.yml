name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - run: make testlua

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make testpy
      - run: python -m pip install ipykernel
      - run: python -m ipykernel install --user --name ipynb-peek-e2e
      - run: IPYNB_PEEK_E2E_KERNEL=ipynb-peek-e2e make teste2e
